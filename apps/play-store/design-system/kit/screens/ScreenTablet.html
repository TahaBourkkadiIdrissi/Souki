<!-- @dsCard group="Écrans P7" page height=1280 width=1740 subtitle="Largeur moyenne (600 à 840 dp) : rail de navigation, grille large, fiche en deux colonnes" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../souki-v5.css"><style>
.tab{display:flex;height:100%}
.rail2{width:88px;flex:none;background:var(--surface-container);display:flex;flex-direction:column;align-items:center;gap:12px;padding:48px 0 0;border-inline-end:1px solid var(--outline-variant)}
.rail2 .fabm{width:56px;height:56px;border-radius:16px;background:var(--voice-surface);color:var(--voice-cyan);display:grid;place-items:center;margin-bottom:20px}
.rail2 a{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--on-surface-variant)}
.rail2 i{width:56px;height:32px;border-radius:16px;display:grid;place-items:center;position:relative}
.rail2 .on{color:var(--on-surface)}.rail2 .on i{background:var(--primary-container);color:var(--on-primary-container)}
.main{flex:1;min-width:0;position:relative;overflow:hidden}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:0 24px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:32px;padding:52px 32px 0}
.two .pic{border-radius:28px}
</style></head><body><script src="../souki-v5.js"></script><script>
const {i,L,P,card,phone,price,qty,show}=SK;
const rail=on=>`<nav class="rail2"><span class="fabm">${i('mic',24)}</span>${[['home','Accueil'],['grid','Produits'],['bag','Panier'],['list','Commandes'],['user','Compte']].map(([k,l],n)=>`<a class="${n==on?'on':''}"><i>${i(k,22)}</i>${l}</a>`).join('')}</nav>`;
const cat=()=>`<div class="tab">${rail(1)}<div class="main"><div class="tb" style="padding:52px 24px 8px"><h1>Produits</h1></div><div class="pad" style="padding:0 24px"><div class="search flat">${i('search',22)}Chercher un produit<span class="mic">${i('mic',22)}</span></div></div>
<div class="chips" style="padding:14px 24px">${['Tout','Légumes','Fruits','Herbes'].map((c,n)=>`<span class="chip ${n==1?'on':''}">${n==1?i('check',16):''}${c}</span>`).join('')}</div>
<div class="g4">${['tomate','pomme-de-terre','oignon','carotte','courgette','aubergine','concombre','poivron-rouge','brocoli','radis','laitue','haricot-vert'].map((k,n)=>card(k,n==0?{qty:'2 kg'}:n==6?{low:1}:{})).join('')}</div></div></div>`;
const fiche=()=>{const p=P.tomate;return `<div class="tab">${rail(1)}<div class="main"><div class="two"><span class="pic"><img src="${p.img}" alt=""></span><div style="padding-top:12px"><span class="pill st" style="background:var(--secondary-container);color:var(--on-secondary-container)">En stock · acheté ce matin</span>
<h1 style="font-size:36px;line-height:44px;font-weight:700;letter-spacing:-.8px;margin-top:12px">${p.fr}</h1><p class="soft2">Mtecha · ماطيشة</p><div style="margin:16px 0 12px">${price(p.price,p.unit,'big')}</div>
<p style="font-size:16px;line-height:24px;color:var(--on-surface-variant)">Charnues et juteuses, idéales en salade, en sauce ou pour une chakchouka généreuse.</p>
<div class="row" style="gap:12px;margin-top:24px">${qty('2 kg','lite')}<span class="btn wide">Ajouter · <span class="num">7 DH</span></span></div>
<div class="info" style="margin-top:24px">${i('truck',22)}<span>Livraison demain, entre 8h et 15h</span></div></div></div></div></div>`};
show(phone({cap:'Catalogue · 800 × 1180 dp · clair',w:800,h:1180,full:1},cat)+phone({cap:'Fiche produit en deux colonnes · sombre',w:800,h:1180,full:1,theme:'dark'},fiche));
</script></body></html>
