<!-- @dsCard group="Écrans P2" page height=900 width=1590 subtitle="Adresse, notifications, thème et langue, changer de mot de passe" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../souki-v5.css"></head><body><script src="../souki-v5.js"></script><script>
const {i,L,phone,ab,field,row,grp,sw,radio,map,show}=SK;
const adr=()=>ab('Adresse')+map({h:260})+`<div class="pad">${field('Adresse',{v:'Rue 12, Narjiss C, Fès',icon:'pin'})+field('Précisions pour le livreur',{ph:'Étage, interphone, repère…'})}</div>`;
const ntf=()=>ab('Notifications')+`<div class="pad"><p class="soft2">Vous choisissez ce que SOUKI peut vous envoyer. Aucune relance publicitaire.</p></div><div style="margin-top:12px">${grp('',[row('truck','Suivi de commande','Confirmée, en route, livrée',sw(1)),row('refresh','Abonnements','Rappel avant la fermeture du marché',sw(1)),row('shield','Compte et sécurité','Connexion depuis un nouvel appareil',sw(1)),row('spark','Nouveautés','Nouveaux produits, deux fois par mois au plus',sw(0))])}</div>`;
const thm=()=>ab(L('Thème et langue','المظهر واللغة'))+grp(L('Thème','المظهر'),[row('phone',L('Système','النظام'),L('Suit le réglage du téléphone','يتبع إعدادات الهاتف'),radio(0)),row('sun',L('Clair','فاتح'),'',radio(0)),row('moon',L('Sombre','داكن'),'',radio(1))])+grp(L('Langue','اللغة'),[row('','Français','',radio(0)),row('','العربية','',radio(1))]);
const pw=()=>ab('Changer de mot de passe')+`<div class="pad">${field('Mot de passe actuel',{v:'••••••••',icon:'lock',trail:'eye'})+field('Nouveau mot de passe',{v:'••••••••••',icon:'lock',trail:'eye',help:'8 caractères au moins.',focus:1})+field('Confirmer le nouveau mot de passe',{ph:'Saisir à nouveau',icon:'lock'})}<div class="note ok">${i('shield',20)}<span>Les autres appareils seront déconnectés.</span></div></div>`;
const save=t=>()=>'<div class="act"><span class="btn">'+t+'</span></div>';
show(phone({cap:'Adresse',bar:save('Enregistrer l\'adresse')},adr)+phone({cap:'Notifications : les quatre canaux'},ntf)+phone({cap:'Thème et langue · sombre · arabe',theme:'dark',lang:'ar'},thm)+phone({cap:'Changer de mot de passe',bar:save('Mettre à jour')},pw));
</script></body></html>
