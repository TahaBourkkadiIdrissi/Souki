<!-- @dsCard group="Écrans P5" page height=900 width=1590 subtitle="Wallet (clair, sombre arabe, vide) et parrainage (dessiné, caché au lancement)" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../souki-v5.css"></head><body><script src="../souki-v5.js"></script><script>
const {i,L,phone,ab,row,grp,dh,show,IL}=SK;
const M=[['Remboursement de réclamation','استرجاع شكاية','16 nov.','16 نونبر',3.5],['Paiement de commande','أداء طلب','15 nov.','15 نونبر',-24],['Remboursement d\'annulation','استرجاع إلغاء','9 nov.','9 نونبر',61.5],['Bienvenue parrainage (crédit offert)','مرحبا بالإحالة (رصيد مهدى)','2 nov.','2 نونبر',20]];
const w=()=>ab(L('Wallet','المحفظة'))+`<div class="hc"><span class="sm" style="font-weight:600">${L('Solde disponible','الرصيد المتوفر')}</span><span class="amt num">61 DH</span><p class="sm">${L('Déduit au moment de valider une commande.','يُخصم عند تأكيد الطلب.')}</p>
<div class="bal"><div><span class="sm soft2">${L('Remboursements','الاسترجاعات')}</span><b class="num">41 DH</b></div><div><span class="sm soft2">${L('Crédit offert','رصيد مهدى')}</span><b class="num">20 DH</b></div></div></div>
<p class="gt">${L('Mouvements','الحركات')}</p><div class="grp">${M.map(([f,a,d,da,v])=>row(v>0?'plus':'bag',L(f,a),L(d,da),`<span class="num ${v>0?'amt-p':'amt-m'}">${v>0?'+':'−'} ${dh(Math.abs(v))} DH</span>`)).join('')}</div>`;
const none=()=>ab('Wallet')+`<div class="empty"><img src="${IL}empty-wallet.webp" alt=""><p class="h2" style="margin-top:16px">Votre Wallet est vide</p><p class="soft2">Les remboursements d'une réclamation ou d'une annulation arrivent ici. Ils se déduisent de votre prochaine commande.</p></div>`;
const ref=()=>ab('Parrainage')+`<div class="hc" style="background:var(--secondary-container);color:var(--on-secondary-container)"><p class="t16">Offrez <span class="num">20 DH</span>, recevez <span class="num">20 DH</span></p><p class="sm" style="margin-top:4px">Votre proche s'inscrit avec votre code. Vous recevez chacun le crédit dès sa première commande livrée.</p>
<div class="row sp" style="margin-top:16px;background:var(--surface-container-lowest);border-radius:var(--radius-md);padding:10px 12px 10px 16px"><span class="code num" style="color:var(--on-surface)">SALMA7K2</span><span class="ib">${i('share',20)}</span></div><p class="sm num" style="margin-top:8px">souki.io/r/SALMA7K2</p></div>
<p class="gt">Vos filleuls · <span class="num">2</span></p><div class="grp">${row('user','Nadia','Première commande livrée','<span class="num amt-p">+ 20 DH</span>')}${row('user','Yassine','Inscrit, en attente de sa première commande','')}</div>`;
show(phone({cap:'Wallet · clair · français',tab:4},w)+phone({cap:'Wallet · sombre · arabe',theme:'dark',lang:'ar',tab:4},w)+phone({cap:'Wallet vide',tab:4},none)
+phone({cap:'Parrainage (caché tant qu\'il n\'est pas utilisable de bout en bout)',bar:()=>'<div class="act"><span class="btn">'+i('share',20)+'Partager mon code</span></div>'},ref));
</script></body></html>
