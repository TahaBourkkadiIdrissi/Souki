<!-- @dsCard group="Écrans P3" page height=900 width=1590 subtitle="Checkout : changer d'adresse, nouvelle adresse, pourquoi la date est fixée, marché fermé pendant la commande" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../souki-v5.css"></head><body><script src="../souki-v5.js"></script><script>
const {i,L,phone,ab,field,row,grp,radio,sheet,map,show}=SK;
// Règles (packages/shared/src/rules.ts) : commandes 08h00 → 01h00, livraison le lendemain entre 8h et 15h, Fès uniquement.
const co=()=>ab(L('Finaliser la commande','إتمام الطلب'))+grp(L('Livraison','التوصيل'),[row('pin',L('Rue 12, Narjiss C, Fès','زنقة 12، النرجس C، فاس'),'Salma · <span class="num">+212 6 12 34 56 78</span>'),row('truck',L('Demain, lundi 16 novembre','غدا، الإثنين 16 نونبر'),L('Entre 8h et 15h','بين 8 و 15'))])
+grp(L('Paiement','الأداء'),[row('wallet',L('Paiement à la livraison','الدفع عند التسليم'),L('En espèces, à la réception','نقدا، عند الاستلام'),radio(1))]);
const addr=()=>sheet(`<p class="h2 pad">${L('Adresse de livraison','عنوان التوصيل')}</p><p class="pad soft2" style="margin:4px 0 12px">${L('SOUKI livre à Fès uniquement.','SOUKI يوصل داخل فاس فقط.')}</p>
${grp('',[row('',L('Maison','الدار'),L('Rue 12, Narjiss C, Fès','زنقة 12، النرجس C، فاس'),radio(true)),row('',L('Chez mes parents','عند الوالدين'),L('Avenue Allal El Fassi, Saïss, Fès','شارع علال الفاسي، سايس، فاس'),radio(false))])}
<div class="act" style="background:none"><span class="btn tonal" style="width:100%">${i('plus',20)}${L('Ajouter une adresse','إضافة عنوان')}</span></div>`);
const neu=()=>ab(L('Nouvelle adresse','عنوان جديد'))+map({h:330})+`<div class="pad">${field(L('Adresse','العنوان'),{v:L('Avenue Allal El Fassi, Saïss, Fès','شارع علال الفاسي، سايس، فاس'),icon:'pin'})}${field(L('Étage, porte, repère (facultatif)','الطابق، الباب، علامة (اختياري)'),{v:L('2e étage, porte verte','الطابق الثاني، الباب الأخضر'),focus:1})}${field(L('Nom de l\'adresse','اسم العنوان'),{v:L('Chez mes parents','عند الوالدين')})}</div>`;
const date=()=>sheet(`<p class="h2 pad">${L('Pourquoi demain ?','علاش غدا؟')}</p><p class="pad" style="margin:8px 0 12px;font-size:16px;line-height:24px">${L('SOUKI achète vos produits au marché de gros le matin de la livraison. Une commande validée aujourd\'hui est donc livrée demain, entre 8h et 15h. Seule l\'heure se choisit.','SOUKI يشتري منتوجاتك من سوق الجملة صباح يوم التوصيل. لذلك يصل الطلب المؤكد اليوم غدا، بين 8 و15. وحدها الساعة يمكن اختيارها.')}</p>
${grp('',[row('cal',L('Demain, lundi 16 novembre','غدا، الإثنين 16 نونبر'),L('Commandes jusqu\'à 01h00 cette nuit','الطلبات حتى 01:00 هذه الليلة'),''),row('clock',L('Heure souhaitée : 10h00','الوقت المفضل: 10:00'),L('Entre 08h00 et 14h00, livraison avant 15h00','بين 08:00 و14:00، والتوصيل قبل 15:00'),'')])}<div class="act" style="background:none"><span class="btn" style="width:100%">${L('Compris','فهمت')}</span></div>`);
const closed=()=>ab(L('Finaliser la commande','إتمام الطلب'))+`<div class="pad"><div class="note bad" style="margin-top:0;background:var(--surface-container-high);color:var(--on-surface)">${i('moon',20)}<span>${L('Le marché a fermé à 01h00. Votre panier est gardé : vous pourrez valider dès 08h00, pour une livraison mardi.','أُغلق السوق على 01:00. سلتك محفوظة: يمكنك التأكيد ابتداءً من 08:00، والتوصيل يوم الثلاثاء.')}</span></div></div>`
+grp(L('Livraison','التوصيل'),[row('pin',L('Rue 12, Narjiss C, Fès','زنقة 12، النرجس C، فاس'),'Salma · <span class="num">+212 6 12 34 56 78</span>'),row('truck',L('Mardi 17 novembre, si vous validez dès 08h00','الثلاثاء 17 نونبر، إذا أكدت ابتداءً من 08:00'),L('Entre 8h et 15h','بين 8 و 15'),'')])
+`<div class="sum" style="margin-top:8px"><div><span class="soft2">${L('Sous-total','المجموع الفرعي')}</span><span class="num">50,50 DH</span></div><div><span class="soft2">${L('Livraison','التوصيل')}</span><span class="num">15 DH</span></div><div class="tot"><span>${L('À payer à la livraison','المبلغ عند التسليم')}</span><span class="num">65,50 DH</span></div><p class="sm soft2" style="margin-top:6px">${L('Les prix peuvent changer à 08h00 : ce sont les prix du jour.','قد تتغير الأثمنة على 08:00: إنها أسعار اليوم.')}</p></div>`;
const cta=(t,c='')=>()=>'<div class="act"><span class="btn '+c+'">'+t+'</span></div>';
show(phone({cap:'Changer d\'adresse · clair · français',modal:addr,bar:cta(L('Confirmer la commande','تأكيد الطلب')+' · <span class="num">65,50 DH</span>')},co)
+phone({cap:'Nouvelle adresse sur la carte',bar:cta(L('Utiliser cette adresse','استعمال هذا العنوان'))},neu)
+phone({cap:'La date est fixée : on explique pourquoi',modal:date,bar:cta(L('Confirmer la commande','تأكيد الطلب')+' · <span class="num">65,50 DH</span>')},co)
+phone({cap:'Marché fermé pendant la commande',bar:cta(i('clock',20)+L('Validation dès 08h00 · dans','التأكيد ابتداءً من 08:00 · بعد')+' <span class="num">6:52:10</span>','off')},closed));
</script></body></html>
