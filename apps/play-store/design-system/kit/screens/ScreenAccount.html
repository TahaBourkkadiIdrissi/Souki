<!-- @dsCard group="Écrans P2" page height=900 width=1590 subtitle="Compte, profil, sécurité, suppression du compte" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../souki-v5.css"></head><body><script src="../souki-v5.js"></script><script>
const {i,L,phone,ab,field,row,grp,sw,show}=SK;
const acc=()=>`<div class="tb"><h1>Compte</h1></div><div class="row pad" style="gap:16px;margin:4px 0 4px"><span class="av">S</span><div><p class="t16">Salma B.</p><p class="soft2">salma@exemple.ma</p></div></div>
${grp('Mon compte',[row('user','Profil','Prénom, photo, téléphone'),row('pin','Adresse','Rue 12, Narjiss C, Fès'),row('shield','Sécurité','Mot de passe, appareils connectés')])}
${grp('Préférences',[row('bell','Notifications','Suivi de commande activé'),row('sun','Thème','Système'),row('globe','Langue','Français')])}
${grp('Aide',[row('chat','Contacter SOUKI','Appel ou WhatsApp'),row('logout','Se déconnecter','',''),row('trash','Supprimer mon compte','','')])}`;
const pro=()=>ab('Profil')+`<div style="display:grid;place-items:center;margin:8px 0 4px"><span class="av" style="width:112px;height:112px;font-size:44px">S<span class="ib">${i('camera',18)}</span></span></div><div class="pad">${field('Prénom',{v:'Salma'})+field('E-mail',{v:'salma@exemple.ma',icon:'mail',help:'Pour changer d\'e-mail, nous envoyons un code à la nouvelle adresse.'})+field('Téléphone',{v:'+212 6 12 34 56 78',icon:'phone',num:1})}</div>`;
const sec=()=>ab('Sécurité')+grp('',[row('lock','Changer de mot de passe','Modifié il y a 3 mois')])+grp('Appareils connectés',[row('phone','Samsung Galaxy A15','Cet appareil · Fès · actif maintenant',''),row('phone','Redmi Note 12','Fès · il y a 3 jours','<span class="link">Déconnecter</span>'),row('globe','Navigateur Chrome','souki.io · il y a 2 semaines','<span class="link">Déconnecter</span>')])+`<div class="pad"><span class="btn out md" style="display:flex;margin-top:16px">Déconnecter tous les autres appareils</span></div>`;
const del=()=>ab('Supprimer mon compte')+`<div class="pad"><p style="font-size:16px;line-height:24px">La suppression est définitive. Voici ce qui disparaît :</p></div><div style="margin-top:12px">${grp('',[row('user','Votre profil et votre adresse','',''),row('heart','Vos favoris et vos abonnements','',''),row('bag','L\'historique de vos commandes','','')])}</div>
<div class="pad"><div class="note">${i('info',20)}<span>Votre crédit Wallet de <span class="num">24 DH</span> sera perdu. Vous pouvez d'abord l'utiliser sur une commande.</span></div>${field('Mot de passe, pour confirmer',{ph:'Votre mot de passe',icon:'lock',trail:'eye'})}</div>`;
show(phone({cap:'Compte',tab:4},acc)+phone({cap:'Profil et photo',bar:()=>'<div class="act"><span class="btn">Enregistrer</span></div>'},pro)+phone({cap:'Sécurité : sessions'},sec)
+phone({cap:'Suppression : deux boutons de même taille, aucun piège',bar:()=>'<div class="act" style="gap:8px"><span class="btn danger">Supprimer définitivement</span><span class="btn tonal">Garder mon compte</span></div>'},del));
</script></body></html>
