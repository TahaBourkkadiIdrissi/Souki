<!-- @dsCard group="Écrans P5" page height=900 width=1590 subtitle="Abonnements : liste, détail, pause, création" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../souki-v5.css"></head><body><script src="../souki-v5.js"></script><script>
const {i,P,phone,ab,row,grp,radio,tone,sheet,dh,show}=SK;
const th=ids=>`<div class="row" style="gap:6px;margin:12px 0">${ids.map(k=>`<span class="pic" style="width:40px;border-radius:var(--radius-sm)"><img src="${P[k].img}" alt=""></span>`).join('')}</div>`;
const list=()=>ab('Abonnements')+`<p class="pad soft2" style="margin-bottom:12px">Le même panier, livré à votre rythme. Vous sautez, mettez en pause ou arrêtez quand vous voulez.</p>
<div class="sub"><div class="row sp"><p class="t16">Légumes de la semaine</p>${tone('road','Actif')}</div><p class="sm soft2">Chaque semaine · prochaine livraison jeudi 19 nov.</p>${th(['tomate','pomme-de-terre','oignon','carotte','courgette'])}<div class="row sp"><span class="num t16">≈ 96 DH</span><span class="link">Gérer</span></div></div>
<div class="sub"><div class="row sp"><p class="t16">Salade du quotidien</p>${tone('wait','En pause')}</div><p class="sm soft2">Tous les 3 jours · reprend le lundi 30 nov.</p>${th(['laitue','concombre','radis'])}<div class="row sp"><span class="num t16">≈ 26 DH</span><span class="link">Reprendre</span></div></div>`;
const det=()=>ab('Légumes de la semaine')+`<div class="pad">${tone('road','Actif')}<p class="big" style="margin-top:12px">Jeudi 19 novembre</p><p class="soft2">Prochaine livraison, à partir de 10h00. Le panier est commandé la veille avant 01h00, aux prix du jour.</p></div>
<p class="gt">Ce qui est livré</p><div class="grp">${[['tomate',2],['pomme-de-terre',5],['oignon',3]].map(([k,n])=>row('',P[k].fr,`<span class="num">${n} ${P[k].unit} · ≈ ${dh(P[k].price*n)} DH</span>`,'')).join('')}</div>
<p class="gt">Gérer</p><div class="grp">${row('right','Sauter la prochaine livraison','La suivante : jeudi 26 nov.')}${row('clock','Mettre en pause','De 1 à 4 semaines')}${row('pencil','Modifier les produits ou le rythme','Chaque semaine · paiement à la livraison')}${row('x','Arrêter l\'abonnement','Sans frais, effet immédiat','')}</div>`;
const pause=()=>sheet(`<p class="h2 pad">Mettre en pause</p><p class="pad soft2" style="margin:4px 0 12px">Aucune livraison pendant la pause. L'abonnement reprend tout seul.</p>${grp('',[1,2,3,4].map(n=>row('',`<span class="num">${n}</span> semaine${n>1?'s':''}`,`Reprise le ${['jeu. 26 nov.','jeu. 3 déc.','jeu. 10 déc.','jeu. 17 déc.'][n-1]}`,radio(n==2))))}<div class="act" style="background:none"><span class="btn">Mettre en pause 2 semaines</span></div>`);
const F=[['Chaque jour','Livrée tous les jours'],['Tous les 3 jours','Idéal pour les produits frais'],['Chaque semaine','Le même jour chaque semaine'],['Toutes les 2 semaines','Un jour sur deux semaines']];
const make=()=>ab('Nouvel abonnement')+`<p class="pad soft2">À partir de votre panier actuel : <span class="num">5</span> produits, ≈ <span class="num">96 DH</span>.</p><p class="gt">Rythme</p>${grp('',F.map(([a,b],n)=>row('',a,b,radio(n==2))))}<p class="gt">Jour et paiement</p>${grp('',[row('cal','Jeudi, à partir de 10h00','Première livraison : jeudi 19 nov.'),row('cash','Paiement à la livraison','Ou avec votre Wallet')])}`;
show(phone({cap:'Liste',tab:4},list)+phone({cap:'Détail : sauter, pause, arrêter'},det)+phone({cap:'Feuille : pause de 1 à 4 semaines',modal:pause},det)+phone({cap:'Création depuis le panier',bar:()=>'<div class="act"><span class="btn">Créer l\'abonnement</span></div>'},make));
</script></body></html>
