<!-- @dsCard group="Écrans P6" page height=900 width=1980 subtitle="Consentement IA, commande vocale « Du mot au panier » : écoute, analyse, liste prête, pas compris" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../souki-v5.css"></head><body><script src="../souki-v5.js"></script><script>
const {i,L,P,phone,ab,row,grp,qty,price,dh,show}=SK;
const consent=()=>ab('')+`<div class="ob" style="padding-top:0"><span class="orb sm" style="display:block;margin:0"></span><h1 style="margin-top:24px">Avant d'utiliser l'assistant</h1><p class="lead">Dictez ou écrivez votre liste : l'assistant la transforme en panier. Voici comment.</p></div>
<div style="margin-top:20px">${grp('',[row('mic','Votre voix ou votre texte est envoyé','Pour être compris et transformé en liste de produits.',''),row('check','Rien n\'est commandé sans vous','Vous vérifiez la liste avant de l\'ajouter au panier.',''),row('shield','Vous pouvez arrêter quand vous voulez','Compte › Assistant, à tout moment.','')])}</div><p class="pad sm soft2" style="margin-top:16px"><span class="link">Comment nous traitons ces données</span></p>`;
const vtop=t=>`<div class="top"><span>${t}</span><span class="ib">${i('x',22)}</span></div>`;
const listen=()=>`<div class="vs">${vtop(L('Commande vocale','الطلب الصوتي'))}<div style="margin-top:72px"><div class="orb"></div><div class="bars">${[10,22,34,18,40,26,14,30,20,12,24,8].map(h=>`<i style="height:${h}px"></i>`).join('')}</div></div>
<p class="said" style="text-align:center;margin-top:20px">${L('Je vous écoute…','كنسمعك…')}</p><p class="soft num" style="text-align:center;margin-top:6px">0:06 / 0:15</p>
<div style="margin:auto 20px 0"><p class="sm soft" style="margin-bottom:10px">${L('Par exemple','مثلا')}</p><span class="vchip">${L('« 2 kilos de tomates et une botte de menthe »','« جوج كيلو ديال الماطيشة و ربطة نعناع »')}</span><span class="vchip">« Bghit kilo d'btata »</span></div>
<div style="display:grid;place-items:center;margin-top:16px"><span class="btn" style="background:#fff;color:var(--voice-surface)">${L('J\'ai terminé','ساليت')}</span></div></div>`;
const scan=()=>`<div class="vs">${vtop('Du mot au panier')}<p class="sm soft" style="padding:28px 20px 6px">Vous avez dit</p>
<p class="said"><span class="ok">Bghit 2 kilo d'maticha,</span> <span class="now">kilo d'btata</span> <span class="todo">o chi khizzou</span></p>
<div class="feat"><span class="pic"><img src="${P['pomme-de-terre'].img}" alt=""></span><b>Pomme de terre</b><span class="soft num">1 kg · 4 DH</span></div>
<div class="tray"><div class="row sp"><span style="font-weight:600">Votre panier</span><span class="num t16">11 DH</span></div><div class="th"><span class="pic"><img src="${P.tomate.img}" alt=""></span><span class="pic new"><img src="${P['pomme-de-terre'].img}" alt=""></span></div></div></div>`;
const ready=()=>ab('Votre liste est prête')+`<p class="pad soft2" style="margin-bottom:8px">« Bghit 2 kilo d'maticha, kilo d'btata o chi khizzou o ربطة نعناع »</p>
${[['tomate','2 kg',7,''],['pomme-de-terre','1 kg',4,''],['carotte','1 kg',5,'« chi khizzou » : quantité à vérifier']].map(([k,q,v,n])=>`<div class="line"><span class="pic"><img src="${P[k].img}" alt=""></span><div class="mid"><p class="t16">${P[k].fr}</p><p class="sm ${n?'':'soft2'}" style="${n?'color:var(--tertiary)':''}">${n||P[k].dj}</p></div><div style="text-align:end">${price(v,'')}<div style="margin-top:4px">${qty(q,'lite')}</div></div></div>`).join('')}
<div class="line"><span class="pic" style="display:grid;place-items:center;color:var(--motion)">${i('leaf',28)}</span><div class="mid"><p class="t16">Menthe</p><p class="sm" style="color:var(--error)">Pas au marché ce matin</p></div><span class="link">Retirer</span></div>
<div class="pad"><span class="btn out md" style="display:flex;margin-top:16px">${i('plus',20)}Ajouter un produit</span></div>`;
const miss=()=>`<div class="vs">${vtop('Commande vocale')}<div style="margin-top:96px"><div class="orb dim"></div></div><p class="said" style="text-align:center;margin-top:36px">Je n'ai pas bien compris</p><p class="soft" style="text-align:center;padding:8px 32px 0">Dites le produit puis la quantité, en darija ou en français.</p>
<div style="margin:28px 20px 0"><span class="vchip">« 3 kilos d'oignons »</span><span class="vchip">« Jouj kilo d'maticha »</span><span class="vchip">« Une botte de persil »</span></div>
<div style="margin:auto 20px 0;display:flex;flex-direction:column;gap:8px"><span class="btn" style="background:#fff;color:var(--voice-surface);display:flex">${i('mic',20)}Réessayer</span><span class="btn" style="background:rgba(255,255,255,.1);color:#fff;display:flex">Écrire ma liste</span></div></div>`;
show(phone({cap:'Consentement, au premier usage',bar:()=>'<div class="act"><span class="btn">Accepter et continuer</span><span class="btn text md">Pas maintenant</span></div>'},consent)
+phone({cap:'Écoute · arabe (15 s au plus)',full:1,sb:'#fff',lang:'ar'},listen)+phone({cap:'Analyse : un produit à la fois, le panier se remplit',full:1,sb:'#fff'},scan)
+phone({cap:'Liste prête, modifiable',bar:()=>'<div class="act"><span class="btn">Ajouter 3 produits · <span class="num">16 DH</span></span></div>'},ready)+phone({cap:'Pas compris',full:1,sb:'#fff'},miss));
</script></body></html>
