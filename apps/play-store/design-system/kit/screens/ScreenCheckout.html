<!-- @dsCard group="Écrans P3" page height=900 width=1590 subtitle="Checkout, compte restreint, demande de levée" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../souki-v5.css"></head><body><script src="../souki-v5.js"></script><script>
const {i,L,phone,ab,field,row,grp,sw,radio,show}=SK;
const co=()=>ab(L('Finaliser la commande','إتمام الطلب'))+grp(L('Livraison','التوصيل'),[row('pin',L('Rue 12, Narjiss C, Fès','زنقة 12، النرجس C، فاس'),'Salma · <span class="num">+212 6 12 34 56 78</span>'),row('truck',L('Demain, lundi 16 novembre','غدا، الإثنين 16 نونبر'),L('Entre 8h et 15h','بين 8 و 15'),'')])
+`<p class="gt">${L('Heure souhaitée','الوقت المفضل')}</p><div class="chips" style="padding-top:0">${['08h00','10h00','12h00','14h00'].map((h,n)=>`<span class="chip num ${n==1?'on':''}">${h}</span>`).join('')}</div>`
+grp(L('Paiement','الأداء'),[row('wallet',L('Paiement à la livraison','الدفع عند التسليم'),L('En espèces, à la réception','نقدا، عند الاستلام'),radio(1)),row('',L('Utiliser mon crédit Wallet','استعمال رصيد المحفظة'),'<span class="num">24 DH</span> '+L('disponibles','متوفرة'),sw(1))])
+`<div class="sum" style="margin-top:8px"><div><span class="soft2">${L('Sous-total','المجموع الفرعي')}</span><span class="num">50,50 DH</span></div><div><span class="soft2">${L('Livraison','التوصيل')}</span><span class="num">15 DH</span></div><div><span class="soft2">${L('Crédit Wallet','رصيد المحفظة')}</span><span class="num">− 24 DH</span></div><div class="tot"><span>${L('À payer à la livraison','المبلغ عند التسليم')}</span><span class="num">41,50 DH</span></div></div>`;
const blk=()=>ab('Finaliser la commande')+`<div class="pad"><div class="note bad" style="margin-top:0">${i('alert',20)}<span>Votre compte ne peut pas commander pour le moment. Vous pouvez demander la levée de cette restriction : notre équipe vous répond.</span></div></div>`+`<div class="dim">`+grp('Livraison',[row('pin','Rue 12, Narjiss C, Fès','Salma · +212 6 12 34 56 78',''),row('truck','Demain, lundi 16 novembre','Entre 8h et 15h','')])+grp('Paiement',[row('wallet','Paiement à la livraison','En espèces, à la réception','')])+'</div>';
const lev=()=>ab('Demander la levée')+`<div class="pad"><p style="font-size:16px;line-height:24px">Expliquez-nous la situation en quelques mots. Votre panier est conservé.</p>${field('Votre message',{v:'J\'étais absente lors de la dernière livraison, cela ne se reproduira pas.',focus:1})}<div class="note ok">${i('check',20)}<span>Demande envoyée. Vous recevrez une notification dès la réponse.</span></div></div>`;
const cta=(t,c='')=>()=>'<div class="act"><span class="btn '+c+'">'+t+'</span></div>';
show(phone({cap:'Checkout · clair · français',bar:cta('Confirmer la commande · <span class="num">41,50 DH</span>')},co)+phone({cap:'Checkout · sombre · arabe',theme:'dark',lang:'ar',bar:cta('تأكيد الطلب · <span class="num">41,50 DH</span>')},co)
+phone({cap:'Compte restreint',bar:cta('Demander la levée')},blk)+phone({cap:'Demande de levée envoyée',bar:cta('Retour au panier','tonal')},lev));
</script></body></html>
