<!-- @dsCard group="Écrans P5" page height=900 width=1590 subtitle="Abonnements : suspendu (avec sa raison), arrêter, après l'arrêt" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../souki-v5.css"></head><body><script src="../souki-v5.js"></script><script>
const {i,L,P,phone,ab,row,grp,tone,dialog,snack,show}=SK;
// Statuts : ACTIVE, EN_PAUSE, SUSPENDUE, ARRETEE (packages/shared/src/loyalty.ts). Raison de suspension : back-end commande_recurrente_service.
const th=ids=>`<div class="row" style="gap:6px;margin:12px 0">${ids.map(k=>`<span class="pic" style="width:40px;border-radius:var(--radius-sm)"><img src="${P[k].img}" alt=""></span>`).join('')}</div>`;
const WHY=()=>L('Paiement à la livraison bloqué pour ce compte.','الأداء عند التسليم موقوف لهذا الحساب.');
const sus=()=>`<div class="sub"><div class="row sp"><p class="t16">${L('Légumes de la semaine','خضر الأسبوع')}</p>${tone('issue',L('Suspendu','موقوف'))}</div><p class="sm soft2">${L('Chaque semaine · aucune livraison pour le moment','كل أسبوع · لا توصيل حالياً')}</p>${th(['tomate','pomme-de-terre','oignon','carotte','courgette'])}<div class="row sp"><span class="num t16">≈ 96 DH</span><span class="link">${L('Voir','عرض')}</span></div></div>`;
const act=()=>`<div class="sub"><div class="row sp"><p class="t16">${L('Salade du quotidien','سلطة كل يوم')}</p>${tone('road',L('Actif','نشط'))}</div><p class="sm soft2">${L('Tous les 3 jours · prochaine livraison jeudi 19 nov.','كل 3 أيام · التوصيل المقبل الخميس 19 نونبر')}</p>${th(['laitue','concombre','radis'])}<div class="row sp"><span class="num t16">≈ 26 DH</span><span class="link">${L('Gérer','تدبير')}</span></div></div>`;
const list=()=>ab(L('Abonnements','الاشتراكات'))+`<div class="pad"><div class="note bad" style="margin-top:0">${i('alert',20)}<span>${L('Un abonnement est suspendu : ','اشتراك موقوف: ')}${WHY()}</span></div></div>`+sus()+act();
const det=()=>ab(L('Légumes de la semaine','خضر الأسبوع'))+`<div class="pad">${tone('issue',L('Suspendu','موقوف'))}<div class="note bad">${i('alert',20)}<span>${L('Cet abonnement est suspendu : ','هذا الاشتراك موقوف: ')}${WHY()} ${L('Contactez SOUKI pour le réactiver.','اتصلوا بـ SOUKI لإعادة تفعيله.')}</span></div></div>
<div class="pad"><div class="row"><span class="btn wide">${i('call',20)}${L('Appeler','اتصال')}</span><span class="btn tonal wide">${i('chat',20)}${L('WhatsApp','واتساب')}</span></div></div>
${grp(L('Dernières livraisons','آخر التوصيلات'),[row('x',L('Jeudi 12 novembre · non créée','الخميس 12 نونبر · لم يُنشأ'),WHY(),''),row('check',L('Jeudi 5 novembre · commande créée','الخميس 5 نونبر · تم إنشاء الطلب'),'<span class="num">94,50 DH</span>','')])}
${grp('',[row('x',`<span style="color:var(--error)">${L('Arrêter l\'abonnement','إيقاف الاشتراك')}</span>`,'','')])}`;
const stop=()=>dialog(L('Arrêter l\'abonnement ?','إيقاف الاشتراك؟'),L('« Légumes de la semaine » ne sera plus commandé et disparaît de vos abonnements.','لن يُطلب « خضر الأسبوع » بعد الآن، وسيختفي من اشتراكاتك.'),L('Garder','الاحتفاظ'),L('Arrêter','إيقاف'),true);
const after=()=>ab(L('Abonnements','الاشتراكات'))+`<p class="pad soft2" style="margin-bottom:12px">${L('Le même panier, livré à votre rythme. Vous sautez, mettez en pause ou arrêtez quand vous voulez.','نفس السلة، تصلك بالوتيرة التي تختارها. يمكنك التخطي أو الإيقاف المؤقت أو التوقيف متى شئت.')}</p>`+act();
show(phone({cap:'Liste : un abonnement suspendu · clair · français',tab:4},list)+phone({cap:'Détail : la raison et qui contacter'},det)+phone({cap:'Arrêter : confirmation',modal:stop},det)+phone({cap:'Après l\'arrêt',tab:4,over:()=>snack(L('Abonnement arrêté.','تم إيقاف الاشتراك.'))},after));
</script></body></html>
