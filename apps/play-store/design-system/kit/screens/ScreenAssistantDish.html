<!-- @dsCard group="Écrans P6" page height=900 width=1200 subtitle="Panier intelligent par plat : choisir le plat, ce que SOUKI ne vend pas, plat peu couvert" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../souki-v5.css"></head><body><script src="../souki-v5.js"></script><script>
const {i,L,P,phone,ab,tabs,row,grp,line,price,qty,radio,sub,show}=SK;
// Plats et ingrédients : back-end/data/plats-marocains.json (106 plats). « missing_from_catalog » = ce que SOUKI ne vend pas, toujours affiché.
const herb=(fr,ar,q,v)=>`<div class="line"><span class="pic" style="display:grid;place-items:center;color:var(--motion)">${i('leaf',26)}</span><div class="mid"><p class="t16">${L(fr,ar)}</p><p class="sm soft2">${L('Herbes du marché','أعشاب السوق')}</p></div><div style="text-align:end">${price(v,'')}<div style="margin-top:4px">${qty(q,'lite')}</div></div></div>`;
const out=(fr,ar,q)=>row('info',L(fr,ar),`<span class="num">${q}</span>`,'');
const pick=()=>ab(L('Panier intelligent','السلة الذكية'))+tabs([L('Pour la semaine','للأسبوع'),L('Pour un plat','لطبق')],1)+`<div class="pad" style="margin-top:12px"><div class="search" style="margin:0">${i('search',22)}${L('Tajine, zaalouk, couscous…','طاجين، زعلوك، كسكس…')}</div></div>
<div class="chips" style="padding:12px 16px 0;flex-wrap:wrap"><span class="chip on">${L('Tous','الكل')}</span><span class="chip">${L('Tajines','طواجن')}</span><span class="chip">${L('Salades cuites','سلطات مطبوخة')}</span><span class="chip">${L('Couscous','كسكس')}</span></div>
${grp('',[row('',L('Zaalouk d\'aubergines','زعلوك الدنجال'),'zaalouk · '+L('4 personnes','4 أشخاص'),radio(true)),row('',L('Taktouka de poivrons et tomates','تكتوكة الفلفل والماطيشة'),'taktouka · '+L('4 personnes','4 أشخاص'),radio(false)),row('',L('Tajine de poulet au citron confit','طاجين الدجاج بالحامض المرقد'),'tajin djaj b lhamed · '+L('4 personnes','4 أشخاص'),radio(false))])}
<div class="sub"><span class="t16">${L('Personnes','عدد الأشخاص')}</span><div class="chips" style="flex-wrap:wrap;padding:12px 0 0">${[2,4,6,8].map(n=>`<span class="chip num ${n==4?'on':''}" style="min-width:56px;justify-content:center">${n}</span>`).join('')}</div></div>`;
const res=()=>ab(L('Zaalouk pour 4','زعلوك لـ 4 أشخاص'))+`<div class="pad"><div class="note ok" style="margin-top:0">${i('check',20)}<span>${L('5 ingrédients sur 8 sont au marché SOUKI. Paprika, cumin et huile d\'olive : à prévoir à part.','5 مكونات من أصل 8 متوفرة في سوق SOUKI. الفلفل الأحمر المطحون والكمون وزيت الزيتون: حضّروها على حدة.')}</span></div></div>
${[['aubergine','1 kg',6.5],['tomate','1 kg',3.5],['ail','250 g',7]].map(([k,q,v])=>line(k,sub(P[k]),`<div style="text-align:end">${price(v,'')}<div style="margin-top:4px">${qty(q,'lite')}</div></div>`)).join('')}${herb('Coriandre','قزبر','1 lot',2)}${herb('Persil','معدنوس','1 lot',2)}
${grp(L('Pas vendu par SOUKI','لا يبيعه SOUKI'),[out('Paprika','فلفل أحمر مطحون','5 g'),out('Cumin','كمون','5 g'),out('Huile d\'olive','زيت الزيتون','0,1 l')])}<p class="pad sm soft2" style="margin-top:8px">${L('SOUKI vend les légumes, fruits et herbes du marché : prévoyez le reste à part.','SOUKI يبيع خضر وفواكه وأعشاب السوق: حضّروا الباقي على حدة.')}</p>`;
const low=()=>ab(L('Tajine de poulet pour 4','طاجين الدجاج لـ 4 أشخاص'))+`<div class="pad"><div class="note bad" style="margin-top:0">${i('info',20)}<span>${L('Ce plat demande surtout des produits que SOUKI ne vend pas. Nous ajoutons seulement ce qui vient du marché.','هذا الطبق يحتاج أساساً إلى منتوجات لا يبيعها SOUKI. نضيف فقط ما يأتي من السوق.')}</span></div></div>
${[['oignon','0,5 kg',2.25],['ail','250 g',7]].map(([k,q,v])=>line(k,sub(P[k]),`<div style="text-align:end">${price(v,'')}<div style="margin-top:4px">${qty(q,'lite')}</div></div>`)).join('')}${herb('Coriandre','قزبر','1 lot',2)}${herb('Persil','معدنوس','1 lot',2)}
${grp(L('Pas vendu par SOUKI','لا يبيعه SOUKI'),[out('Poulet','دجاج','1,2 kg'),out('Citron confit','حامض مرقد','2'),out('Olives vertes','زيتون أخضر','0,2 kg')])}`;
show(phone({cap:'Choisir le plat · clair · français',bar:()=>`<div class="act"><span class="btn">${L('Composer le panier du plat','ركّب سلة الطبق')}</span></div>`},pick)
+phone({cap:'Résultat : ce qui manque est dit',bar:()=>`<div class="act"><span class="btn">${L('Ajouter 5 produits','أضف 5 منتوجات')} · <span class="num">21 DH</span></span></div>`},res)
+phone({cap:'Plat peu couvert par SOUKI',bar:()=>`<div class="act"><span class="btn">${L('Ajouter 4 produits','أضف 4 منتوجات')} · <span class="num">13,25 DH</span></span></div>`},low));
</script></body></html>
