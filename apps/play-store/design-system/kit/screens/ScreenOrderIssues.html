<!-- @dsCard group="Écrans P4" page height=900 width=1590 subtitle="Historique vide et incidents : livraison refusée, retour au dépôt, annulée" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../souki-v5.css"></head><body><script src="../souki-v5.js"></script><script>
const {i,L,P,phone,ab,tone,steps,tabs,row,grp,show,IL}=SK;
// Textes des incidents : packages/shared/src/orders.ts (ORDER_STATUS_MESSAGES). Même gabarit que « Destinataire absent ».
const empty=()=>`<div class="tb"><h1>${L('Commandes','الطلبات')}</h1></div>${tabs([L('En cours','جارية'),L('Passées','سابقة')])}
<div class="empty" style="top:150px"><img src="${IL}empty-orders.webp" alt=""><p class="h2">${L('Aucune commande en cours','لا توجد طلبات جارية')}</p><p class="soft2">${L('Vos commandes apparaissent ici dès que vous les validez. Livraison le lendemain, entre 8h et 15h.','تظهر طلباتك هنا بمجرد تأكيدها. التوصيل في اليوم التالي، بين 8 و15.')}</p><span class="btn" style="margin-top:12px">${L('Voir le marché','عرض السوق')}</span></div>`;
const head=()=>ab(`${L('Commande','الطلب رقم')} <span class="num">${L('n° ','')}1042</span>`);
const contact=()=>`<div class="pad"><p class="gt" style="margin:8px 0!important">${L('Contacter SOUKI','اتصلوا بـ SOUKI')}</p><div class="row"><span class="btn wide">${i('call',20)}${L('Appeler','اتصال')}</span><span class="btn tonal wide">${i('chat',20)}${L('WhatsApp','واتساب')}</span></div></div>`;
const T0=()=>L('Dimanche 15 nov. · 21h04','الأحد 15 نونبر · 21:04'),T1=()=>L('Lundi 16 nov. · 06h30','الإثنين 16 نونبر · 06:30');
const refus=()=>head()+`<div class="pad">${tone('issue',L('Livraison refusée','تم رفض التسليم'))}<div class="note bad">${i('alert',20)}<span>${L('La livraison a été refusée. Contactez-nous si cette information ne correspond pas à votre situation.','تم رفض التسليم. اتصلوا بنا إذا كانت هذه المعلومة لا تطابق وضعيتكم.')}</span></div></div>`+steps(2,[T0(),T1(),L('Lundi 16 nov. · 11h48 · livraison refusée','الإثنين 16 نونبر · 11:48 · تم رفض التسليم'),''],1)+contact();
const depot=()=>head()+`<div class="pad">${tone('issue',L('Retour au dépôt','رجوع إلى المستودع'))}<div class="note bad">${i('alert',20)}<span>${L('La commande est retournée au dépôt. Notre équipe vous contactera pour la suite.','رجع الطلب إلى المستودع. سيتصل بكم فريقنا لمتابعة الأمر.')}</span></div></div>`+steps(2,[T0(),T1(),L('Lundi 16 nov. · 13h05 · retour au dépôt','الإثنين 16 نونبر · 13:05 · رجوع إلى المستودع'),''],1)+contact();
const annul=()=>head()+`<div class="pad">${tone('issue',L('Annulée','ملغى'))}<div class="note bad">${i('alert',20)}<span>${L('Cette commande a été annulée.','تم إلغاء هذا الطلب.')}</span></div></div>`
+grp(L('La commande','الطلب'),[row('cal',L('Livraison prévue le lundi 16 novembre','التوصيل المبرمج يوم الإثنين 16 نونبر'),L('Annulée le dimanche 15 nov. à 23h40','أُلغي يوم الأحد 15 نونبر على 23:40'),''),row('bag',`<span class="num">4</span> ${L('produits','منتوجات')}`,L('Rien à payer','لا شيء للأداء'),'')])
+`<div class="pad" style="margin-top:16px"><span class="btn tonal wide" style="width:100%">${i('refresh',20)}${L('Recommander le même panier','أعد طلب نفس السلة')}</span><p class="sm soft2" style="margin-top:8px">${L('Aux prix du jour. Les produits épuisés sont signalés avant la validation.','بأسعار اليوم. المنتوجات النافدة يُشار إليها قبل التأكيد.')}</p></div>`;
show(phone({cap:'Historique vide · clair · français',tab:3},empty)+phone({cap:'Incident : livraison refusée'},refus)+phone({cap:'Incident : retour au dépôt'},depot)+phone({cap:'Commande annulée'},annul));
</script></body></html>
