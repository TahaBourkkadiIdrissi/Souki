<!-- @dsCard group="Écrans P7" page height=900 width=1590 subtitle="Notifications et suivi en direct, widgets et raccourcis, mise à jour disponible" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../souki-v5.css"><style>
.shade{position:absolute;inset:0;background:#101512;color:#E6EAE6;padding:44px 12px 0}
.qs{display:flex;gap:8px;margin:8px 4px 16px}.qs i{flex:1;height:52px;border-radius:26px;background:#232A25}
.nt{background:#1D231F;border-radius:24px;padding:14px 16px;margin-bottom:8px}
.nt .h{display:flex;gap:8px;align-items:center;font-size:12px;color:#A3ADA5}
.d{width:22px;height:22px;border-radius:50%;background:#005B43;display:grid;place-items:center;flex:none}
.d img{width:14px}
.nt b{display:block;font-weight:600;margin-top:6px;color:#fff}
.seg4{display:flex;align-items:center;gap:4px;margin:14px 0 6px}.seg4 i{flex:1;height:6px;border-radius:3px;background:#3A443D}.seg4 .on{background:#4CB84A}
.seg4 .pt{width:22px;height:22px;flex:none;border-radius:50%;background:#4CB84A;display:grid;place-items:center;color:#0A2814;margin:0 -2px}
.wall{position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,#3B6B57,#173528 60%,#0E1F17);padding:52px 16px 0}
.wg{border-radius:28px;padding:16px;color:#1F2A22;background:#FBFBF7}
.wg.dk{background:#0C3B22;color:#EEF6EE}
.wg .cd2{font-size:36px;line-height:40px;font-weight:700;letter-spacing:-1.2px}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 0;margin-top:24px;justify-items:center;color:#fff;font-size:12px}
.ap{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.14)}
.ap.s{background:#005B43;display:grid;place-items:center}.ap.s img{width:34px}
.shc{position:absolute;left:28px;top:440px;width:236px;background:#FBFBF7;color:#1F2A22;border-radius:20px;padding:8px 0;box-shadow:0 18px 40px -12px rgba(0,0,0,.5)}
.shc div{display:flex;align-items:center;gap:14px;min-height:48px;padding:0 16px;font-weight:600}.shc .i{color:#1E8A3C}
</style></head><body><script src="../souki-v5.js"></script><script>
const {i,P,phone,show,BLOB,IL}=SK;
const dot=`<span class="d"><img src="${BLOB.splash}" alt=""></span>`;
const shade=()=>`<div class="shade"><div class="qs"><i></i><i></i><i></i><i></i></div>
<div class="nt"><div class="h">${dot}SOUKI · Suivi de commande · maintenant</div><b>En livraison · arrivée avant 15h</b><span style="color:#A3ADA5">Commande n° 1042 · Youssef a quitté le dépôt à 9h12</span>
<div class="seg4"><span class="pt">${i('check',14)}</span><i class="on"></i><span class="pt">${i('check',14)}</span><i class="on"></i><span class="pt">${i('truck',14)}</span><i></i><span class="pt" style="background:#3A443D;color:#A3ADA5">${i('home',14)}</span></div>
<div class="row" style="justify-content:space-between;font-size:11px;color:#A3ADA5"><span>Confirmée</span><span>Préparation</span><span>En livraison</span><span>Livrée</span></div></div>
<div class="nt"><div class="h">${dot}SOUKI · Abonnements · 23:00</div><b>Votre panier de la semaine part demain</b><span style="color:#A3ADA5">Modifiable jusqu'à 01h00. Légumes de la semaine · ≈ 96 DH</span><div class="row" style="gap:18px;margin-top:10px;color:#9BE7AE;font-weight:600"><span>Modifier</span><span>Sauter cette fois</span></div></div>
<div class="nt"><div class="h">${dot}SOUKI · Suivi de commande · hier</div><b>Commande livrée</b><span style="color:#A3ADA5">Bon appétit, Salma. Un souci avec un produit ? Signalez-le avant demain 11h40.</span></div></div>`;
const home=()=>`<div class="wall"><div class="wg"><div class="row sp"><span class="row" style="gap:8px;font-weight:600">${dot}Marché du jour</span><span class="sm" style="color:#5A695C">Widget 4 × 2</span></div>
<div class="row sp" style="margin-top:10px"><div><span class="cd2 num">03:42:18</span><p class="sm" style="color:#5A695C">avant la fermeture, à 01h00</p></div><span class="btn md" style="min-height:44px;padding:0 16px">Commander</span></div></div>
<div class="row" style="gap:12px;margin-top:12px"><div class="wg dk" style="flex:1"><p class="sm" style="color:#9BE7AE;font-weight:600">En livraison</p><p style="font-weight:600;margin-top:4px">Avant 15h</p><div class="lin" style="margin-top:12px;background:#1F4D31"><i style="width:70%;background:#4CB84A"></i></div><p class="sm" style="color:#9BE7AE;margin-top:8px">Widget 2 × 2</p></div><div style="flex:1"></div></div>
<div class="apps"><span><span class="ap s"><img src="${BLOB.splash}" alt=""></span><span style="display:block;text-align:center;margin-top:6px">SOUKI</span></span><span class="ap"></span><span class="ap"></span><span class="ap"></span><span class="ap"></span><span class="ap"></span><span class="ap"></span><span class="ap"></span></div>
<div class="shc">${[['grid','Catalogue'],['mic','Commande vocale'],['list','Mes commandes'],['wallet','Wallet']].map(([k,l])=>`<div>${i(k,22)}${l}</div>`).join('')}</div></div>`;
const upd=()=>`<div class="tb"><h1>Accueil</h1></div><div class="pad"><div class="sub" style="margin:8px 0 0;background:var(--secondary-container);box-shadow:none;color:var(--on-secondary-container)"><div class="row" style="gap:12px;align-items:flex-start">${i('refresh',22)}<div style="flex:1"><p class="t16">Une nouvelle version est prête</p><p class="sm">Téléchargée en arrière-plan. Redémarrez l'app quand vous voulez ; votre panier est conservé.</p></div></div><div class="row" style="justify-content:flex-end;gap:8px;margin-top:12px"><span class="btn text md">Plus tard</span><span class="btn md" style="min-height:40px;padding:0 16px">Redémarrer</span></div></div></div>`;
show(phone({cap:'Volet des notifications : suivi en direct (Android 16), rappel, livrée',full:1,sb:'#E6EAE6'},shade)+phone({cap:'Écran d\'accueil : widgets 4 × 2 et 2 × 2, raccourcis (appui long)',full:1,sb:'#fff'},home)+phone({cap:'Mise à jour disponible (mise à jour flexible)',tab:0},upd));
</script></body></html>
