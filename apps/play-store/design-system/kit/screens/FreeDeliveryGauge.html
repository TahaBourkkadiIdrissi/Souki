<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../souki-v5.css"><style>.cmp .cells{grid-template-columns:1fr}.cmp .cells.two{grid-template-columns:1fr 1fr}.cmp .cells.three{grid-template-columns:1fr 1fr 1fr}.cmp .cells.three .said{font-size:15px!important;line-height:22px!important}[data-theme=dark] .empty img{display:none}.empty .alt{display:none;width:88px;height:88px;border-radius:50%;background:var(--primary-container);color:var(--on-primary-container);place-items:center}[data-theme=dark] .empty .alt{display:grid}.box{border-radius:20px;overflow:hidden;background:var(--surface);box-shadow:0 0 0 1px var(--outline-variant);position:relative}</style></head><body><script src="../souki-v5.js"></script><script>
const {i,L,P,line,price,qty,steps,tone,show,IL}=SK;
const cell=(t,h,c='')=>`<div class="cell ${c}"><small>${t}</small>${h}</div>`;
const C=()=>cell('Sous le minimum de commande (50 DH livraison comprise)',`<div class="note" style="margin:0">${i('info',20)}<span>Encore <span class="num">14,50 DH</span> pour atteindre le minimum de 50 DH, livraison comprise.</span></div>`)
+cell('Vers la livraison offerte',`<div class="gauge" style="margin:0"><div class="row sp"><span style="font-weight:600">Encore <span class="num">249,50 DH</span> pour la livraison offerte</span>${i('truck',22)}</div><div class="track"><i style="width:17%"></i></div></div>`)
+cell('Livraison offerte (dès 300 DH)',`<div class="gauge" style="margin:0"><div class="row sp"><span style="font-weight:600">Livraison offerte</span>${i('check',22)}</div><div class="track"><i style="width:100%"></i></div></div>`);
show(`<div class="cmp"><section data-theme="light"><h5>Clair</h5><div class="cells ">${C()}</div></section><section data-theme="dark"><h5>Sombre</h5><div class="cells ">${C()}</div></section></div>`);
</script></body></html>
