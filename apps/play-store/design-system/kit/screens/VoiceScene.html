<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../souki-v5.css"><style>.cmp .cells{grid-template-columns:1fr}.cmp .cells.two{grid-template-columns:1fr 1fr}.cmp .cells.three{grid-template-columns:1fr 1fr 1fr}.cmp .cells.three .said{font-size:15px!important;line-height:22px!important}[data-theme=dark] .empty img{display:none}.empty .alt{display:none;width:88px;height:88px;border-radius:50%;background:var(--primary-container);color:var(--on-primary-container);place-items:center}[data-theme=dark] .empty .alt{display:grid}.box{border-radius:20px;overflow:hidden;background:var(--surface);box-shadow:0 0 0 1px var(--outline-variant);position:relative}</style></head><body><script src="../souki-v5.js"></script><script>
const {i,L,P,line,price,qty,steps,tone,show,IL}=SK;

const C=()=>cell('Écoute',`<div class="box" style="height:360px"><div class="vs" style="padding-top:20px"><div style="margin-top:40px"><div class="orb" style="width:96px;height:96px"></div><div class="bars">${[10,22,34,18,40,26,14,30,20,12].map(h=>`<i style="height:${h}px"></i>`).join('')}</div></div><p class="said" style="text-align:center;margin-top:12px;font-size:18px">Je vous écoute…</p></div></div>`)
+cell('Analyse : un groupe à la fois, le panier se remplit',`<div class="box" style="height:360px"><div class="vs" style="padding-top:16px"><p class="sm soft" style="padding:0 20px 6px">Vous avez dit</p><p class="said" style="font-size:19px;line-height:28px"><span class="ok">Bghit 2 kilo d’maticha,</span> <span class="now">kilo d’btata</span> <span class="todo">o chi khizzou</span></p><div class="tray" style="margin:auto 12px 12px"><div class="row sp"><span style="font-weight:600">Votre panier</span><span class="num t16">11 DH</span></div></div></div></div>`)
+cell('Pas compris',`<div class="box" style="height:360px"><div class="vs" style="padding-top:20px"><div style="margin-top:40px"><div class="orb dim" style="width:96px;height:96px"></div></div><p class="said" style="text-align:center;margin-top:28px;font-size:18px">Je n’ai pas bien compris</p><div style="margin:16px 20px 0"><span class="vchip">« 3 kilos d’oignons »</span></div></div></div>`);
show(`<div class="cmp"><section data-theme="light"><h5>Clair</h5><div class="cells three">${C()}</div></section><section data-theme="dark"><h5>Sombre</h5><div class="cells three">${C()}</div></section></div>`);
</script></body></html>
