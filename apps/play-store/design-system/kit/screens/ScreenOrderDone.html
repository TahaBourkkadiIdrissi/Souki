<!-- @dsCard group="Écrans P3" page height=900 width=1590 subtitle="Commande validée, puis demande de notifications" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../souki-v5.css"></head><body><script src="../souki-v5.js"></script><script>
const {i,L,phone,row,grp,dialog,show,IL}=SK;
const done=ill=>()=>`<div class="ob" style="text-align:center;padding-top:72px"><div style="display:grid;place-items:center;margin-bottom:20px">${ill?`<img src="${IL}checkout-celebration.webp" alt="" style="width:190px;mix-blend-mode:multiply">`:`<span class="big-ic">${i('check',48)}</span>`}</div><h1>${L('Commande validée','تم تأكيد الطلب')}</h1><p class="lead">${L('Merci Salma. Livraison demain, lundi 16 novembre, entre 8h et 15h.','شكرا سلمى. التوصيل غدا، الإثنين 16 نونبر، بين 8 و 15.')}</p></div>
<div class="oc" style="margin-top:24px"><div class="kv"><span class="soft2">${L('Commande','الطلب')}</span><span class="num">n° 1042</span></div><div class="kv"><span class="soft2">${L('Heure souhaitée','الوقت المفضل')}</span><span class="num">10h00</span></div><div class="kv"><span class="soft2">${L('À payer à la livraison','المبلغ عند التسليم')}</span><b class="num">41,50 DH</b></div></div>`;
const act=()=>`<div class="act"><span class="btn">${L('Suivre ma commande','تتبع طلبي')}</span><span class="btn text md">${L('Retour à l\'accueil','العودة للرئيسية')}</span></div>`;
const ntf=()=>`<div class="ob" style="padding-top:72px"><span class="big-ic" style="background:var(--primary-container);color:var(--on-primary-container)">${i('bell',44)}</span><h1 style="margin-top:24px">Être prévenu quand le livreur arrive&nbsp;?</h1><p class="lead">SOUKI vous écrit seulement pour votre commande.</p></div><div style="margin-top:20px">${grp('',[row('check','Commande confirmée','',''),row('truck','Livreur en route','',''),row('bag','Commande livrée','','')])}</div>`;
const nact=()=>'<div class="act"><span class="btn">Activer les notifications</span><span class="btn text md">Plus tard</span></div>';
show(phone({cap:'Commande validée · clair · français',bar:act},done(1))+phone({cap:'Commande validée · sombre · arabe',theme:'dark',lang:'ar',bar:act},done(0))
+phone({cap:'Après la première commande : explication',bar:nact},ntf)+phone({cap:'Puis la demande système d\'Android',bar:nact,modal:()=>dialog('Autoriser SOUKI à vous envoyer des notifications ?','Dialogue du système : son texte et ses boutons ne sont pas modifiables.','Ne pas autoriser','Autoriser')},ntf));
</script></body></html>
