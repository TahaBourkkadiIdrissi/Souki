<!-- @dsCard group="Commande" height=190 -->
<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;padding:24px;background:var(--surface);font-family:var(--font-sans);color:var(--on-surface)}
.r{display:flex;gap:8px;flex-wrap:wrap}
.p{font:600 12px/16px var(--font-sans);padding:6px 12px 6px 8px;border-radius:var(--radius-full);display:inline-flex;align-items:center;gap:6px}
svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.w{background:var(--surface-container-high);color:var(--on-surface)}
.g{background:var(--secondary-container);color:var(--on-secondary-container)}
.d{background:var(--primary);color:var(--on-primary)}
.x{background:var(--error-container);color:var(--on-error-container)}
.st{display:flex;margin-top:28px;max-width:560px}
.st div{flex:1;font:600 12px/16px var(--font-sans);color:var(--on-surface-variant);position:relative;padding-top:36px}
.st div::before{content:"";position:absolute;top:11px;left:24px;right:0;height:2px;background:var(--motion-track)}
.st div:last-child::before{display:none}
.st i{position:absolute;top:0;left:0;width:24px;height:24px;border-radius:50%;background:var(--motion-track);display:grid;place-items:center;color:var(--on-primary)}
.st .ok{color:var(--on-surface)}.st .ok i{background:var(--motion)}.st .ok::before{background:var(--motion)}
.st .now{color:var(--on-surface)}.st .now i{background:var(--surface);box-shadow:inset 0 0 0 2px var(--motion),0 0 0 4px var(--motion-track);color:var(--motion)}
.st svg{width:14px;height:14px;stroke-width:3}
</style></head><body>
<div class="r">
<span class="p w"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>En préparation</span>
<span class="p g"><svg viewBox="0 0 24 24"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2M15 18H9M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.62l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg>En route</span>
<span class="p d"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>Livrée</span>
<span class="p x"><svg viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3M12 9v4M12 17h.01"/></svg>Destinataire absent</span>
</div>
<div class="st">
<div class="ok"><i><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></i>Commande confirmée</div>
<div class="ok"><i><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></i>Préparation</div>
<div class="now"><i><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="currentColor"/></svg></i>En livraison</div>
<div><i></i>Livrée</div>
</div>
</body></html>
