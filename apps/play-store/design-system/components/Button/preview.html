<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;padding:24px;background:var(--surface);font-family:var(--font-sans);display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center}
button{font:600 14px/20px var(--font-sans);border:0;border-radius:var(--radius-md);height:var(--control-lg);padding:0 24px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;position:relative;overflow:hidden;transition:transform var(--duration-press) var(--ease-souki-out)}
button:active{transform:scale(var(--press-scale))}
button::after{content:"";position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity var(--duration-press)}
button:hover::after{opacity:var(--state-hover)}button:active::after{opacity:var(--state-pressed)}
button:focus-visible{outline:2px solid var(--motion);outline-offset:2px}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.filled{background:var(--primary);color:var(--on-primary)}
.tonal{background:var(--primary-container);color:var(--on-primary-container)}
.outline{background:none;color:var(--primary);box-shadow:inset 0 0 0 1px var(--outline)}
.text{background:none;color:var(--secondary);padding:0 12px}
.urgent{background:var(--tertiary-container);color:var(--on-tertiary-container)}
.icon{width:48px;height:48px;padding:0;justify-content:center;background:var(--secondary-container);color:var(--on-secondary-container)}
.fab{background:var(--voice-surface);color:var(--on-voice-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-float)}
.fab svg{stroke:var(--voice-cyan)}
.off{background:color-mix(in srgb,var(--on-surface) 12%,transparent);color:color-mix(in srgb,var(--on-surface) 38%,transparent);cursor:default}
.off::after{display:none}.br{flex-basis:100%;height:0}
</style></head><body>
<button class="filled">Valider la commande</button>
<button class="tonal">Recommander</button>
<button class="outline">Modifier</button>
<button class="text">Plus tard</button>
<button class="off" disabled>Valider la commande</button>
<div class="br"></div>
<button class="urgent">Commander avant 01h00</button>
<button class="icon" aria-label="Ajouter au panier"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
<button class="fab"><svg viewBox="0 0 24 24"><path d="M12 19v3M19 10v2a7 7 0 0 1-14 0v-2"/><rect x="9" y="2" width="6" height="13" rx="3"/></svg>Dicter ma liste</button>
<button class="filled" dir="rtl" style="font-family:var(--font-arabic);font-size:15px">تأكيد الطلب</button>
</body></html>
