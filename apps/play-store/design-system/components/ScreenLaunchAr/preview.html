<!-- @dsCard group="Écrans P0 · arabe" page height=900 width=1200 subtitle="Écran de démarrage système, intro « Le marché se réveille », variante de nuit" -->
<!doctype html><html><head><meta charset="utf-8"><style>:root, [data-theme="light"]{--surface:#FBFBF7;--surface-dim:#E4E9E1;--surface-bright:#FFFFFF;--surface-container-lowest:#FFFFFF;--surface-container-low:#F7F8F3;--surface-container:#F2F6F3;--surface-container-high:#ECF1EB;--surface-container-highest:#E3E9E2;--on-surface:#1F2A22;--on-surface-variant:#5A695C;--outline:#7C8B7D;--outline-variant:#E7ECE5;--inverse-surface:#1F2A22;--inverse-on-surface:#F2F6F3;--primary:#005B43;--on-primary:#FFFFFF;--primary-container:#E7F5E8;--on-primary-container:#005B43;--inverse-primary:#9BE7AE;--secondary:#176B2E;--on-secondary:#FFFFFF;--secondary-container:#F0FAF1;--on-secondary-container:#176B2E;--tertiary:#B35400;--on-tertiary:#FFFFFF;--tertiary-container:#F07C00;--on-tertiary-container:#1F2A22;--error:#DC2626;--on-error:#FFFFFF;--error-container:#FDECEC;--on-error-container:#8F1414;--motion:#1E8A3C;--motion-track:#DDEFE0;--favorite:#E4405F;--badge:#F5C400;--on-badge:#1F2A22;--warning-container:#FFF1DE;--on-warning-container:#B35400;--voice-cyan:#50DCE6;--voice-teal:#28BEAA;--voice-surface:#123F22;--on-voice-surface:#FFFFFF;--photo-bg:#F1F6EF;--hero-from:#0A2814;--hero-mid:#14522A;--hero-to:#1E8A3C;--on-hero:#FFFFFF;--on-hero-variant:#9BE7AE;--scrim:rgba(10, 40, 20, 0.40);--trust:#1A4F8A;--shadow-card:0 10px 24px -14px rgba(30, 138, 60, 0.35);--shadow-float:0 16px 36px -14px rgba(10, 40, 20, 0.38);--shadow-sheet:0 -12px 36px -16px rgba(10, 40, 20, 0.30);}
[data-theme="dark"]{--surface:#0A2814;--surface-dim:#071D0E;--surface-bright:#1B5936;--surface-container-lowest:#06190C;--surface-container-low:#0B311B;--surface-container:#0C3B22;--surface-container-high:#114529;--surface-container-highest:#164F30;--on-surface:#EEF6EE;--on-surface-variant:#A9C4AF;--outline:#7FA088;--outline-variant:#1F4D31;--inverse-surface:#EEF6EE;--inverse-on-surface:#1F2A22;--primary:#9BE7AE;--on-primary:#0A2814;--primary-container:#14522A;--on-primary-container:#D3F5DA;--inverse-primary:#005B43;--secondary:#7FD492;--on-secondary:#0A2814;--secondary-container:#0F4526;--on-secondary-container:#9BE7AE;--tertiary:#FFB547;--on-tertiary:#1F2A22;--tertiary-container:#F07C00;--on-tertiary-container:#1F2A22;--error:#FF8A80;--on-error:#3B0A0A;--error-container:#5C1414;--on-error-container:#FFD9D6;--motion:#4CB84A;--motion-track:#1F4D31;--favorite:#FF7A93;--badge:#F5C400;--on-badge:#1F2A22;--warning-container:#4A2A05;--on-warning-container:#FFB547;--voice-cyan:#50DCE6;--voice-teal:#28BEAA;--voice-surface:#123F22;--on-voice-surface:#FFFFFF;--photo-bg:#DDE8DA;--hero-from:#06190C;--hero-mid:#0C3B22;--hero-to:#14522A;--on-hero:#FFFFFF;--on-hero-variant:#9BE7AE;--scrim:rgba(0, 0, 0, 0.60);--trust:#1A4F8A;--shadow-card:0 10px 24px -14px rgba(0, 0, 0, 0.6);--shadow-float:0 16px 36px -14px rgba(0, 0, 0, 0.7);--shadow-sheet:0 -12px 36px -16px rgba(0, 0, 0, 0.7);}
:root{--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;--space-12:48px;--radius-xs:4px;--radius-sm:8px;--radius-md:12px;--radius-lg:16px;--radius-lg-inc:20px;--radius-xl:28px;--radius-xl-inc:32px;--radius-xxl:48px;--radius-full:999px;--touch-min:48px;--control-md:48px;--control-lg:56px;--nav-bar:64px;--top-bar:64px;--cart-bar:56px;--icon:24px;--duration-press:120ms;--duration-fast:160ms;--duration-base:240ms;--duration-slow:300ms;--duration-screen:400ms;--duration-stagger:40ms;--ease-souki-out:cubic-bezier(0.16, 1, 0.3, 1);--ease-emphasized:cubic-bezier(0.2, 0, 0, 1);--ease-emphasized-decelerate:cubic-bezier(0.05, 0.7, 0.1, 1);--ease-emphasized-accelerate:cubic-bezier(0.3, 0, 0.8, 0.15);--ease-standard:cubic-bezier(0.2, 0, 0, 1);--state-hover:0.08;--state-focus:0.10;--state-pressed:0.10;--state-dragged:0.16;--state-disabled-content:0.38;--state-disabled-container:0.12;--press-scale:0.97;--font-sans:"Instrument Sans", "IBM Plex Sans Arabic", system-ui, sans-serif;--font-arabic:"IBM Plex Sans Arabic", "Instrument Sans", system-ui, sans-serif;}

/* SOUKI Android : feuille commune des écrans. Tout passe par les tokens (tokens.css). */
html,body{margin:0}
body{background:var(--surface-dim);padding:28px;display:flex;gap:28px;align-items:flex-start;font-family:var(--font-sans)}
.col{display:flex;flex-direction:column;gap:10px}
.cap{font:600 calc(12px*var(--fs,1))/calc(16px*var(--fs,1)) var(--font-sans);color:var(--on-surface-variant)}
.ph{width:360px;height:800px;flex:none;border-radius:32px;overflow:hidden;position:relative;background:var(--surface);color:var(--on-surface);font:400 calc(14px*var(--fs,1))/calc(20px*var(--fs,1)) var(--font-sans);outline:6px solid #0b100c;-webkit-font-smoothing:antialiased}
.ph[dir=rtl]{font-family:var(--font-arabic);font-size:calc(15px*var(--fs,1));line-height:calc(26px*var(--fs,1))}
.ph[dir=rtl] *{letter-spacing:0!important}
.ph *{box-sizing:border-box}
.ph p,.ph h1,.ph h2,.ph h3{margin:0}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;font-family:var(--font-sans)}
.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
[dir=rtl] .flip{transform:scaleX(-1)}
.sb{position:absolute;inset:0 0 auto;height:36px;padding:0 22px;display:flex;justify-content:space-between;align-items:center;font:600 calc(13px*var(--fs,1))/calc(16px*var(--fs,1)) var(--font-sans);z-index:9;direction:ltr}
.sb span{display:flex;gap:5px;align-items:center}
.sc{position:absolute;inset:0;overflow:hidden;padding-bottom:140px}
.bot{position:absolute;inset:auto 0 0;z-index:8}
.gest{height:20px;background:var(--surface-container);display:grid;place-items:center}
.gest::after{content:"";width:108px;height:4px;border-radius:2px;background:var(--on-surface);opacity:.55}
.bot.plain .gest{background:var(--surface-container-lowest)}
/* barre de navigation + mini-barre panier */
.nav{min-height:var(--nav-bar);background:var(--surface-container);display:flex;border-top:1px solid var(--outline-variant)}
.nav a{flex:1;min-width:0;padding:6px 0;--fs:min(var(--fl),1.15);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:600;font-size:calc(12px*var(--fs,1));line-height:calc(16px*var(--fs,1));color:var(--on-surface-variant)}
.nav i{width:56px;height:28px;border-radius:var(--radius-full);display:grid;place-items:center;position:relative;font-style:normal}
.nav .on{color:var(--on-surface)}.nav .on i{background:var(--primary-container);color:var(--on-primary-container)}
.nav em{position:absolute;top:-4px;inset-inline-end:6px;min-width:16px;height:16px;border-radius:8px;background:var(--tertiary-container);color:var(--on-tertiary-container);font:700 calc(11px*var(--fs,1))/calc(16px*var(--fs,1)) var(--font-sans);text-align:center}
.cart{margin:0 16px 8px;min-height:var(--cart-bar);border-radius:var(--radius-lg-inc);background:var(--primary);color:var(--on-primary);display:flex;align-items:center;padding-inline:8px 16px;gap:12px;box-shadow:var(--shadow-float);font-weight:600}
.cart .n{min-width:40px;height:40px;border-radius:var(--radius-md);background:var(--on-primary);color:var(--primary);display:grid;place-items:center;font-weight:700}
.cart .t{margin-inline-start:auto}
/* prix */
.pr{display:inline-flex;flex-wrap:wrap;align-items:baseline;gap:4px;color:var(--secondary)}
.pr b{font-size:calc(20px*var(--fl,1));line-height:calc(24px*var(--fs,1));font-weight:700;letter-spacing:-.5px}
.pr small{font-size:calc(12px*var(--fs,1));line-height:calc(16px*var(--fs,1));font-weight:600}
.pr.big b{font-size:calc(48px*var(--fl,1));line-height:calc(52px*var(--fl,1));letter-spacing:-1.9px}
.pr.inh{color:inherit}
/* boutons */
.btn{min-height:var(--control-lg);border-radius:var(--radius-md);padding:0 24px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:calc(14px*var(--fs,1));background:var(--primary);color:var(--on-primary);white-space:nowrap}
.ph[dir=rtl] .btn{font-size:calc(15px*var(--fs,1))}
.btn.tonal{background:var(--primary-container);color:var(--on-primary-container)}
.btn.md{min-height:var(--control-md)}
.btn.wide{display:flex;flex:1}
.ib{width:48px;height:48px;border-radius:var(--radius-md);display:grid;place-items:center;background:var(--secondary-container);color:var(--on-secondary-container);flex:none}
.ib.glass{background:rgba(255,255,255,.12);color:inherit}
.ib.fav{color:var(--favorite)!important}
.ib.surf{background:var(--surface-container-lowest);color:var(--on-surface);box-shadow:0 0 0 1px var(--outline-variant)}
.fav{color:var(--favorite)}.fav path{fill:currentColor}
/* en-tête de l'accueil : l'horloge du marché */
.hero{padding:48px 16px 20px;border-radius:0 0 var(--radius-xl-inc) var(--radius-xl-inc);color:var(--on-hero);background:linear-gradient(160deg,var(--hero-from),var(--hero-mid) 60%,var(--hero-to))}
.hero .soft{color:var(--on-hero-variant)}
.hero.last{background:var(--tertiary-container);color:var(--on-tertiary-container)}
.hero.last .soft{color:inherit}
.hero.closed{background:var(--hero-from)}
.row{display:flex;align-items:center;gap:8px}
.sp{justify-content:space-between}
.addr{font-size:calc(12px*var(--fs,1));line-height:calc(16px*var(--fs,1));font-weight:600}
.hi{font-size:calc(32px*var(--fl,1));line-height:calc(38px*var(--fl,1));font-weight:700;letter-spacing:-1px;margin-top:16px!important}
.ph[dir=rtl] .hi{font-size:calc(30px*var(--fl,1));line-height:calc(46px*var(--fl,1))}
.search{min-height:52px;border-radius:var(--radius-xl);background:var(--surface-container-lowest);color:var(--on-surface-variant);display:flex;align-items:center;gap:12px;padding:0 16px;margin-top:16px;font-size:calc(16px*var(--fs,1))}
.hero .search{background:var(--surface-bright)}
.search.flat{background:var(--surface-container-high);margin:0}
.search .mic{margin-inline-start:auto;color:var(--primary)}
.pad{padding:0 16px}
.h2{font-size:calc(20px*var(--fl,1));line-height:calc(28px*var(--fl,1));font-weight:600;letter-spacing:-.3px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:24px 16px 12px}
.link{font-weight:600;color:var(--secondary)}
.soft2{color:var(--on-surface-variant)}
.sm{font-size:calc(12px*var(--fs,1));line-height:calc(16px*var(--fs,1))}
.ph[dir=rtl] .sm{font-size:calc(13px*var(--fs,1));line-height:calc(22px*var(--fs,1))}
/* cartes assistants */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 16px 0}
.as{border-radius:var(--radius-lg-inc);padding:14px;min-height:104px;display:flex;flex-direction:column;justify-content:space-between;background:var(--surface-container-lowest);box-shadow:0 0 0 1px var(--outline-variant);font-weight:600}
.as.voice{background:linear-gradient(150deg,var(--voice-surface),#0A2614);color:var(--on-voice-surface);box-shadow:none}
.as.voice .i{color:var(--voice-cyan)}.as .i{color:var(--motion)}
.as small{display:block;font-weight:400;font-size:calc(12px*var(--fs,1));line-height:calc(16px*var(--fs,1));opacity:.8}
/* carte Marché du jour */
.mk{margin:12px 16px 0;border-radius:var(--radius-xl);padding:18px 20px;background:var(--surface-container-lowest);box-shadow:0 0 0 1px var(--outline-variant)}
.eye{font-size:calc(11px*var(--fs,1));line-height:calc(16px*var(--fs,1));font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--on-surface-variant);display:flex;align-items:center;gap:8px}
.eye::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--motion)}
.eye.last{color:var(--tertiary)}.eye.last::before{background:var(--tertiary-container)}
.eye.closed::before{background:var(--badge)}
.cd{font-size:calc(52px*var(--fl,1));line-height:calc(56px*var(--fl,1));font-weight:700;letter-spacing:-2.2px;margin-top:10px;display:block}
.cd u{text-decoration:none;opacity:.35}
/* rayons */
.rail{display:flex;gap:12px;padding:0 16px;overflow:hidden}
.tile{width:72px;flex:none;text-align:center;font-size:calc(12px*var(--fs,1));line-height:calc(16px*var(--fs,1));font-weight:600}
.tile i{display:grid;place-items:center;width:72px;height:72px;border-radius:var(--radius-lg);color:#fff;margin-bottom:6px}
.tile .ink{color:var(--on-badge)}
.strip{margin:16px 16px 0;border-radius:var(--radius-lg);background:var(--secondary-container);color:var(--on-secondary-container);padding:12px 16px;display:flex;gap:12px;align-items:center;font-weight:600}
/* carte produit */
.pc{background:var(--surface-container-lowest);border:1px solid var(--outline-variant);border-radius:var(--radius-lg);padding:8px 8px 10px;position:relative;min-width:0}
.rail .pc{width:148px;flex:none}
.pc.in{border-color:var(--motion);box-shadow:inset 0 0 0 1px var(--motion)}
.pic{aspect-ratio:1;background:var(--photo-bg);border-radius:var(--radius-md);overflow:hidden;position:relative;display:block}
.pic img{width:100%;height:100%;object-fit:contain;padding:8%;box-sizing:border-box;display:block;filter:drop-shadow(0 6px 6px rgba(20,60,30,.16))}
.out .pic img{filter:grayscale(1);opacity:.45}
.pill{position:absolute;inset:8px auto auto 8px;font-size:calc(11px*var(--fs,1));line-height:calc(16px*var(--fs,1));font-weight:600;padding:2px 8px;border-radius:var(--radius-full);background:var(--warning-container);color:var(--on-warning-container)}
[dir=rtl] .pill{inset:8px 8px auto auto}
.pill.gone{background:var(--error-container);color:var(--on-error-container)}
.pill.st{position:static;display:inline-block}
.pc h3{font-size:calc(14px*var(--fs,1));line-height:calc(20px*var(--fs,1));font-weight:600;margin:8px 4px 0}
.pc p{margin:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .foot{margin:6px 4px 0;min-height:24px}
.pc.in .foot{display:none}
.pc>.ib{position:absolute;inset:14px 14px auto auto;width:40px;height:40px;background:var(--surface-container-lowest);color:var(--primary);box-shadow:0 0 0 1px var(--outline-variant)}
[dir=rtl] .pc>.ib{inset:14px auto auto 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.qty{display:flex;align-items:center;justify-content:space-between;background:var(--primary);color:var(--on-primary);border-radius:var(--radius-md);min-height:48px;font-weight:600}
.qty b{white-space:nowrap}
.qty span{width:44px;height:48px;display:grid;place-items:center}
.pc .qty{margin-top:6px}
.qty.lite{background:var(--secondary-container);color:var(--on-secondary-container);height:40px;width:124px}
.qty.lite span{height:40px;width:40px}
/* top app bar, chips */
.tb{padding:44px 16px 8px}
.tb h1{font-size:calc(28px*var(--fl,1));line-height:calc(36px*var(--fl,1));font-weight:700;letter-spacing:-.6px}
.ph[dir=rtl] .tb h1{line-height:calc(44px*var(--fl,1))}
.chips{display:flex;gap:8px;padding:12px 16px;overflow:hidden}
.chip{min-height:36px;padding:0 14px;border-radius:var(--radius-sm);box-shadow:inset 0 0 0 1px var(--outline);display:inline-flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--primary-container);color:var(--on-primary-container);box-shadow:none}
/* lignes, résumé, jauge */
.line{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--outline-variant)}
.line .pic{width:64px;flex:none}
.line .mid{flex:1;min-width:0}
.t16{font-size:calc(16px*var(--fs,1));line-height:calc(24px*var(--fs,1));font-weight:600}
.gauge{margin:8px 16px 4px;padding:14px 16px;border-radius:var(--radius-lg-inc);background:var(--surface-container-lowest);box-shadow:0 0 0 1px var(--outline-variant)}
.track{height:8px;border-radius:4px;background:var(--motion-track);margin-top:10px;overflow:hidden}
.track i{display:block;height:100%;border-radius:4px;background:var(--motion)}
.sum{padding:8px 16px}
.sum div{display:flex;justify-content:space-between;padding:4px 0}
.sum .tot{font-size:calc(16px*var(--fs,1));font-weight:600;padding-top:8px;margin-top:4px;border-top:1px solid var(--outline-variant)}
.buy{padding:12px 16px;background:var(--surface-container-lowest);box-shadow:var(--shadow-sheet);display:flex;gap:12px;align-items:center;border-top:1px solid var(--outline-variant)}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 40px 120px;text-align:center;gap:8px}
.empty img{width:200px;border-radius:var(--radius-xl);mix-blend-mode:multiply}
.info{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--outline-variant)}
.info .i{color:var(--motion)}
/* ---------- itération 3 : formulaires, listes, états ---------- */
.ab{padding:40px 8px 4px;display:flex;align-items:center;gap:4px;min-height:92px}
.ab h2{font-size:calc(20px*var(--fl,1));line-height:calc(28px*var(--fl,1));font-weight:600;letter-spacing:-.3px;flex:1}
.ib.ghost{background:none;color:var(--on-surface)}
.fld{margin-top:16px}
.fld label{display:block;font-size:calc(12px*var(--fs,1));line-height:calc(16px*var(--fs,1));font-weight:600;color:var(--on-surface-variant);margin-bottom:6px}
.fld .box{min-height:56px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px var(--outline);display:flex;align-items:center;gap:12px;padding:8px 16px;font-size:calc(16px*var(--fs,1));line-height:calc(24px*var(--fs,1));color:var(--on-surface)}
.fld .box .i{color:var(--on-surface-variant)}
.fld .phd{color:var(--on-surface-variant)}
.fld .tr{margin-inline-start:auto;display:flex}
.fld p{font-size:calc(12px*var(--fs,1));line-height:calc(16px*var(--fs,1));color:var(--on-surface-variant);margin:6px 4px 0!important}
.fld.foc .box{box-shadow:inset 0 0 0 2px var(--motion)}
.fld.err .box{box-shadow:inset 0 0 0 2px var(--error)}.fld.err p,.fld.err label{color:var(--error)}
.caret{width:2px;height:22px;background:var(--motion);margin-inline-start:-10px}
.otp{display:flex;gap:8px;direction:ltr;margin-top:24px}
.otp span{flex:1;height:60px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px var(--outline);display:grid;place-items:center;font-size:calc(28px*var(--fl,1));line-height:calc(32px*var(--fl,1));font-weight:600;font-family:var(--font-sans);font-variant-numeric:tabular-nums}
.otp .on{box-shadow:inset 0 0 0 2px var(--motion)}
.otp.err span{box-shadow:inset 0 0 0 2px var(--error)}
.ob{padding:52px 24px 0}
.ob h1,.big{font-size:calc(28px*var(--fl,1));line-height:calc(36px*var(--fl,1));font-weight:700;letter-spacing:-.6px}
.ph[dir=rtl] .ob h1,.ph[dir=rtl] .big{line-height:calc(46px*var(--fl,1))}
.ob .lead{font-size:calc(16px*var(--fs,1));line-height:calc(24px*var(--fs,1));color:var(--on-surface-variant);margin-top:8px!important}
.act{padding:12px 16px 8px;background:var(--surface);display:flex;flex-direction:column;gap:4px}
.act .btn{display:flex}
.btn.text{background:none;color:var(--secondary)}
.btn.out{background:none;color:var(--on-surface);box-shadow:inset 0 0 0 1px var(--outline)}
.btn.danger{background:var(--error);color:var(--on-error)}
.btn.off{background:var(--surface-container-highest);color:var(--on-surface-variant);opacity:.7}
.bot.plain .gest{background:var(--surface)}
.road{display:block;margin:0 0 28px -4px}[dir=rtl] .road{transform:scaleX(-1)}
.rt,.rp{fill:none;stroke-width:6;stroke-linecap:round}.rt{stroke:var(--motion-track)}.rp{stroke:var(--motion)}
.rk{fill:var(--primary)}.ri{color:var(--on-primary);stroke:var(--on-primary)}
.li{display:flex;align-items:center;gap:16px;padding:12px 16px;min-height:56px}
.li+.li{border-top:1px solid var(--outline-variant)}
.li>.i:first-child{color:var(--motion)}
.li .mid{flex:1;min-width:0}
.grp{margin:0 16px;border-radius:var(--radius-lg-inc);background:var(--surface-container-lowest);box-shadow:0 0 0 1px var(--outline-variant);overflow:hidden}
.gt{font-size:calc(12px*var(--fs,1));line-height:calc(16px*var(--fs,1));font-weight:600;color:var(--on-surface-variant);margin:20px 32px 8px!important}
