# CI de securite et de qualite (audit cybersecurite — travaux communs).
# Lint, typecheck et tests sont OBLIGATOIRES : une erreur TypeScript ou un test
# en echec bloque le pipeline (BUG-003). Les audits de dependances (npm/pip) et
# le scan de secrets (VULN-001) sont egalement bloquants.
name: CI

on:
  push:
    branches: ["main", "refactor", "AUDIT_CYBERSECURITE_DEBUG"]
  pull_request:

jobs:
  secret-scanning:
    name: Scan de secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend (tests + audit pip)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-end
    env:
      # Valeurs factices : les tests n'ouvrent aucune connexion reelle.
      SECRET_KEY: ci-secret-key-not-a-real-secret
      user: ci_user
      password: ci_password
      host: localhost
      port: "5432"
      dbname: ci_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: back-end/requirements.lock.txt
      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
      - name: Tests unitaires (dont tests de securite)
        run: python scripts/test_local.py
      - name: Audit des dependances Python
        # PYSEC-2026-1325 (ecdsa, attaque par canal auxiliaire) : aucune version
        # corrigee n'existe ; ecdsa est une dependance obligatoire de python-jose.
        # Correctif reel : migrer python-jose vers PyJWT.
        run: |
          pip install pip-audit
          pip-audit -r requirements.lock.txt --ignore-vuln PYSEC-2026-1325

  frontend:
    name: Front-end (lint + typecheck + build + audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Installation reproductible depuis le lockfile
        run: pnpm install --frozen-lockfile
      - name: Verifier les frontieres des interfaces
        run: node tools/check-frontend-boundaries.mjs
      - name: Lint
        run: pnpm lint
      - name: Typecheck (bloquant, BUG-003)
        run: pnpm typecheck
      - name: Build (ignoreBuildErrors=false)
        run: pnpm build
      - name: Audit des dependances de production
        run: pnpm audit --prod

  container-builds:
    name: Docker (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [client, livreur, admin, backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build sans publication ni configuration de production
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = backend ]; then
            docker build -f back-end/Dockerfile .
          else
            docker build -f apps/${{ matrix.target }}/Dockerfile .
          fi
